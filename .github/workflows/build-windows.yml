name: Release Windows Installer

on:
  push:
    tags:
      - "bat-*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a re-construir (ej: v1.5.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build .exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Gradle (Skip Tests)
        shell: cmd
        run: gradlew.bat build --no-daemon -x test

      # ── Versión ──────────────────────────────────────────────────────────────
      # Leemos version.properties y strippeamos sufijos alpha/alfa para obtener
      # un número semver limpio compatible con jpackage (X.Y.Z)
      - name: Extract Version
        id: vars
        shell: pwsh
        run: |
          $raw = (Get-Content src/main/resources/version.properties |
                  Select-String "^version=").ToString().Split("=",2)[1].Trim()
          $clean = $raw -replace "-alpha","" -replace "-alfa",""
          # jpackage requiere que la versión tenga al menos dos componentes (X.Y)
          if ($clean -notmatch "^\d+\.\d+") { $clean = "$clean.0" }
          echo "VERSION=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Launcher version: $clean"

      # ── Icono ─────────────────────────────────────────────────────────────────
      # jpackage en Windows EXIGE un .ico; convertimos icon.png usando
      # la herramienta magick (ImageMagick v7 pre-instalado en windows-latest).
      - name: Convert icon PNG -> ICO
        shell: pwsh
        run: |
          # ImageMagick 7 en windows-latest se llama 'magick', no 'convert'
          magick icon.png -resize 256x256 icon.ico
          Write-Host "icon.ico generado OK"

      # ── Inno Setup (requerido por jpackage para producir .exe) ───────────────
      # jpackage --type exe usa Inno Setup 6 internamente. Viene preinstalado
      # en windows-latest pero no está en el PATH; lo añadimos.
      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $innoPath)) {
              Write-Host "Inno Setup no encontrado, instalando con Chocolatey..."
              choco install innosetup -y --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value $innoPath
          Write-Host "Inno Setup listo en $innoPath"

      # ── Empaquetar ────────────────────────────────────────────────────────────
      # jpackage toma el JAR principal + todas las dependencias que Gradle
      # copió en build/libs gracias a la tarea copyDependencies.
      # --win-per-user-install: no requiere UAC al instalar (más compat.)
      # --win-console:          muestra consola solo si se integra con CMD (debug)
      - name: Create .exe with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null

          $MainJar = (Get-ChildItem -Filter "meacore-launcher-*.jar" -Path build/libs |
                      Select-Object -First 1).Name
          Write-Host "Main JAR: $MainJar"

          jpackage `
            --name "MeaCore Launcher" `
            --app-version "$env:VERSION" `
            --vendor "MeaCore-Enterprise" `
            --input build/libs `
            --main-jar $MainJar `
            --main-class com.experimento.launcher.Main `
            --type exe `
            --icon icon.ico `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser `
            --win-per-user-install `
            --java-options "-Xmx512m" `
            --java-options "--add-modules javafx.controls,javafx.fxml" `
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" `
            --java-options "-Dfile.encoding=UTF-8" `
            --dest build/dist

          Write-Host "=== build/dist contents ==="
          Get-ChildItem build/dist

      # ── Renombrar para que el AutoUpdateService lo encuentre fácilmente ──────
      - name: Rename artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Filter "*.exe" -Path build/dist | Select-Object -First 1
          $newName = "meacore-launcher-$env:VERSION.exe"
          Rename-Item $exe.FullName $newName
          Write-Host "Renamed to $newName"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeaCoreLauncher-Windows
          path: build/dist/*.exe

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
